name: iKuuu 每日签到
on:
  schedule:
    - cron: '10 23 * * *'
  workflow_dispatch:
jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - name: 签到
        env:
          IKUUU_COOKIE: ${{ secrets.IKUUU_COOKIE }}
        run: |
          python3 - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          cookie = os.environ.get('IKUUU_COOKIE', '').strip()
          if not cookie:
              sys.exit('签到失败：未配置 IKUUU_COOKIE')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          request = urllib.request.Request('https://ikuuu.pw/user/checkin', method='POST', headers={
              'Cookie': cookie,
              'Origin': 'https://ikuuu.pw',
              'Referer': 'https://ikuuu.pw/user',
              'User-Agent': 'Mozilla/5.0',
              'Accept': 'application/json, text/javascript, */*; q=0.01',
              'X-Requested-With': 'XMLHttpRequest',
          })
          try:
              response = urllib.request.build_opener(NoRedirect).open(request, timeout=30)
              result = json.loads(response.read().decode('utf-8'))
          except (urllib.error.URLError, ValueError) as exc:
              sys.exit('签到请求失败：' + str(exc))
          message = str(result.get('msg', '未知响应'))
          print('签到结果：' + message)
          if result.get('ret') != 1 and not any(x in message for x in ('已签到', '已经签到', '明日再来')):
              sys.exit('签到未成功，请检查登录状态')
          PY
